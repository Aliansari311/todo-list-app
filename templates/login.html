<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - To-Do App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="login-page">
    <div class="login-box">
        <div class="login-logo">✅ To-Do App</div>
        <h2>Welcome Back!</h2>
        <p class="login-subtitle">Enter your name to continue</p>

        <form method="POST" action="/login">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" name="username" placeholder="e.g. Baqar" required>
            </div>
            <button type="submit" class="btn-add" style="width:100%; padding: 12px;">
                Get Started →
            </button>
        </form>
    </div>
</div>

</body>
</html>
